[project]
name = "wav-transcriber"
version = "0.2.0"
description = "Enterprise-grade, accuracy-first WAV transcription pipeline with multi-engine ensemble, real forced alignment, and speaker diarization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "soundfile>=0.12.0",
  "librosa>=0.10.0",
  "noisereduce>=3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
]
asr = [
  "faster-whisper>=1.0.0",
]
asr-full = [
  "faster-whisper>=1.0.0",
  "torch>=2.0.0",
  "transformers>=4.36.0",
  "pyannote.audio>=3.1.0",
  "soundfile>=0.12.0",
]
all = [
  "faster-whisper>=1.0.0",
  "torch>=2.0.0",
  "transformers>=4.36.0",
  "pyannote.audio>=3.1.0",
  "soundfile>=0.12.0",
  "pytest>=7.0.0",
]

[project.scripts]
wav-transcribe = "wav_transcriber.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wav_transcriber*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


